[workspace]
members = [ "crates/*" ]
resolver = "2"

[workspace.package]
version = "0.1.3"
authors = [ "sekun <software@sekun.net>" ]
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/sekunho/moneyman"
readme = "README.md"

[workspace.dependencies]
moneyman = { path = "crates/moneyman", version = "0.1" }
moneyman_cli = { path = "crates/moneyman_cli", version = "0.1" }

## HTTP client
reqwest = { version = "0.12", features = [ "blocking", "rustls-tls" ], default-features = false }

## Bytes data type
bytes = { version = "1.10" }

## Handling ZIP archives/buffers
zip = { version = "6.0", default-features = false }

## Here comes the moneeeeeyyyy, here comes the money
rusty-money = { version = "0.4" }

## Date/time stuff
chrono = { version = "0.4", default-features = false }

## Because I don't want to deal with CSVs, even via polars lol
rusqlite = { version = "0.37", features = ["bundled", "vtab", "csvtab", "chrono"], default-features = false  }
libsqlite3-sys = { version = "0.35.0", features = ["bundled"] }

## Decimal data type
rust_decimal = { version = "1.29", features = ["std"], default-features = false }

## directory stuff
dirs = "6.0"

## CLI
clap = { version = "4.5", features = ["derive", "std", "error-context", "help", "suggestions", "usage"], default-features = false }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
strip = true
panic = "abort"
